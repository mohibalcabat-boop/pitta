<!DOCTYPE html> <html lang="ar" 
dir="rtl"> <head>
    <meta charset="UTF-8"> <meta 
    name="viewport" 
    content="width=device-width, 
    initial-scale=1.0"> 
    <title>NASA Earth Information 
    Center</title> <link 
    rel="stylesheet" 
    href="css/style.css"> <script 
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head> <body> <div id="app"> 
        <header class="header">
            <div class="logo">🌍 
            Earth Info Box</div> 
            <div 
            class="controls">
                <input 
                type="text" 
                id="searchInput" 
                class="search-input"> 
                <select 
                id="langSelect" 
                class="lang-select">
                    <option 
                    value="ar">العربية</option> 
                    <option 
                    value="en">English</option> 
                    <option 
                    value="ja">日本語</option>
                </select> </div> 
        </header> <main 
        class="main-content">
            <section 
            class="viewer-section">
                <div 
                id="canvas-container"></div>
            </section>
            
            <h1 
            id="uiTitle"></h1> <p 
            id="uiDesc"></p> <div 
            class="media-grid">
                <div 
                class="media-card 
                glow-effect">
                    <h3 
                    id="cardTitle3d"></h3> 
                    <p 
                    id="cardDesc3d"></p>
                </div> <div 
                class="media-card 
                glow-effect">
                    <h3 
                    id="cardTitleVideo"></h3> 
                    <p 
                    id="cardDescVideo"></p>
                </div> <div 
                class="media-card 
                glow-effect">
                    <h3 
                    id="cardTitleAudio"></h3> 
                    <p 
                    id="cardDescAudio"></p>
                </div> </div> 
        </main>
    </div> <script 
    src="js/app.js"></script>
</body> </html>
